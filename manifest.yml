name: One Hub
package: lazycat.community.app.one-hub
version: 0.14.23
min_os_version: 1.3.8
description: "All in one 的 OpenAI 接口 整合各种 API 访问方式 一键部署，开箱即用"
homepage: https://github.com/MartialBE/one-hub
author: MartialBE
application:
  subdomain: one-hub
  background_task: true
  public_path:
    - /
  routes:
    - /=http://one-hub:3000/
services:
  one-hub:
  # docker.1ms.run/martialbe/one-api:v0.14.23
    image: registry.lazycat.cloud/czyt/martialbe/one-api:45df3995a31c5f6e
    ontainer_name: one-hub
    environment:
      - REDIS_CONN_STRING=redis://redis 
      - SESSION_SECRET={{stable_secret "onehub#sessionsk" | substr 0 24}}
      - USER_TOKEN_SECRET={{stable_secret "onehub#usertoken" | substr 0 32}}
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/data
    health_check:
      test:
        - CMD-SHELL
        - "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $$2}'"
      start_period: 2m0s      

    depends_on:
      - redis

  redis:
    image: registry.lazycat.cloud/czyt/library/redis:6108db5ea790851d
    container_name: redis
    health_check:
      test:
        - CMD-SHELL
        - redis-cli ping
      start_period: 90s

